[project]
name = "folium-agents"
version = "0.1.0"
description = "External, read-only EHR agent connector experiments"
readme = "README.md"
authors = [
    { name = "Pedro P. Camellon", email = "pedropcamellon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0,<46.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.0,<2.0",
    "PyJWT>=2.8,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "rich>=13.7,<15.0",
    "python-dotenv>=1.0,<2.0",
    "keyring>=25,<27",
]

[project.scripts]
folium-agents = "folium_agents:main"

[project.entry-points."folium_agents.modules"]
epic = "folium_agents.epic.module:create_module"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1.0",
]
